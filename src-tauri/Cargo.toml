[package]
name = "poros"
version = "0.3.1"
description = "SFTP and rsync client"
authors = ["khaodius"]
license = "Apache-2.0"
repository = "https://github.com/khaodius/poros"
edition = "2021"
rust-version = "1.88"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "poros_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
# Checks for, verifies and installs the signed releases listed in latest.json on GitHub.
tauri-plugin-updater = "2.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "net", "io-util", "process"] }
tokio-util = "0.7"
futures = "0.3"
# `ring` instead of the default `aws-lc-rs` backend: it builds with only a C compiler,
# so Windows contributors don't need NASM/CMake.
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
log = "0.4"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
# rsync block and file checksums (protocol 29 uses MD4), and file hashes for sync comparisons.
md4 = "0.10"
md-5 = "0.10"
# Transfer checks against the server's sha256sum.
sha2 = "0.10"
# Line and word differences for comparing two files side by side.
similar = { version = "3.2", default-features = false, features = ["std"] }
bytes = "1"
# Saved passwords: Windows Credential Manager, or the Secret Service (GNOME Keyring, KWallet) on Linux.
keyring = "4.2"
# Installed font families for the appearance settings.
fontdb = "0.24.0"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "glyph-names"] }
async-trait = "0.1"
# FTPS and the cloud APIs. TLS runs on `ring` like the SSH side, and trusts the system's
# certificate store.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "form", "query", "stream"] }
ring = "0.17"
percent-encoding = "2"
# Local time for scheduled tasks, daylight saving changes included.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Desktop notifications when the transfer queue finishes.
tauri-plugin-notification = "2.5"
# A second launch brings the running window forward instead of starting another copy, which
# would run every scheduled task twice and overwrite the saved schedules.
tauri-plugin-single-instance = "2.5"

[target.'cfg(windows)'.dependencies]
# Rounded window corners on Windows 11, and showing the drag preview without taking focus.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
# Paused clocks, so tests of minute-long timeouts run instantly.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
