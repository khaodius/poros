[package]
name = "poros"
version = "0.6.0"
description = "SFTP and rsync client"
authors = ["khaodius"]
license = "Apache-2.0"
repository = "https://github.com/khaodius/poros"
edition = "2021"
rust-version = "1.88"
default-run = "poros"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "poros_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "poros"
path = "src/main.rs"
required-features = ["gui"]

# The headless command line, for scripts and agents. `--no-default-features --features cli`
# builds it without the web view, GTK or the Windows shell, so it runs on servers and in
# containers that have none of them.
[[bin]]
name = "poros-cli"
path = "src/bin/poros-cli.rs"
required-features = ["cli"]

# Runs scheduled tasks, which live in the app.
[[test]]
name = "sftp_server"
required-features = ["gui"]

[[test]]
name = "cli"
required-features = ["cli"]

[features]
default = ["gui", "cli"]
gui = [
  "dep:tauri",
  "dep:tauri-build",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-updater",
  "dep:tauri-plugin-notification",
  "dep:tauri-plugin-single-instance",
  "dep:fontdb",
  "dep:ttf-parser",
  "dep:arboard",
  "dep:png",
  "dep:windows-sys",
  "dep:windows-core",
  "dep:windows",
  "dep:gtk",
  "dep:zbus",
]
cli = ["dep:clap", "tokio/signal", "tokio/io-std"]

[build-dependencies]
tauri-build = { version = "2.7", features = [], optional = true }

[dependencies]
tauri = { version = "2.12", features = [], optional = true }
tauri-plugin-dialog = { version = "2.8", optional = true }
# Checks for, verifies and installs the signed releases listed in latest.json on GitHub.
tauri-plugin-updater = { version = "2.13", optional = true }
# Release versions, to list the ones a user can switch to.
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "net", "io-util", "process"] }
tokio-util = "0.7"
futures = "0.3"
# `ring` instead of the default `aws-lc-rs` backend: it builds with only a C compiler,
# so Windows contributors don't need NASM/CMake.
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
log = "0.4"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
# rsync block and file checksums (protocol 29 uses MD4), and file hashes for sync comparisons.
md4 = "0.10"
md-5 = "0.10"
# Transfer checks against the server's sha256sum.
sha2 = "0.10"
# Line and word differences for comparing two files side by side.
similar = { version = "3.2", default-features = false, features = ["std"] }
bytes = "1"
# Saved passwords: Windows Credential Manager, or the Secret Service (GNOME Keyring, KWallet) on Linux.
keyring = "4.2"
# Installed font families for the appearance settings.
fontdb = { version = "0.24.0", optional = true }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "glyph-names"], optional = true }
async-trait = "0.1"
# FTPS and the cloud APIs. TLS runs on `ring` like the SSH side, and trusts the system's
# certificate store.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "form", "query", "stream"] }
ring = "0.17"
percent-encoding = "2"
# Local time for scheduled tasks, daylight saving changes included.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Desktop notifications when the transfer queue finishes.
tauri-plugin-notification = { version = "2.5", optional = true }
# Text a program in a terminal copies (OSC 52) arrives with no click behind it, which the web
# view's own clipboard refuses on Linux. Text only, so no image codecs.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"], optional = true }
# A second launch brings the running window forward instead of starting another copy, which
# would run every scheduled task twice and overwrite the saved schedules.
tauri-plugin-single-instance = { version = "2.5", optional = true }
# The system's file icons, handed to the page as PNG images.
png = { version = "0.18", optional = true }
# WebDAV listings and S3 answers. Elements are matched by local name, whatever their prefix.
quick-xml = { version = "0.42", features = ["serialize", "overlapped-lists"] }
# Checks `.minisig` signatures published beside downloads against the keys in settings. The
# same version the updater plugin verifies releases with.
minisign-verify = "0.2"
# Arguments of the headless command line.
clap = { version = "4.5", features = ["derive", "env", "wrap_help"], optional = true }

[target.'cfg(windows)'.dependencies]
# Rounded window corners on Windows 11, showing the drag preview without taking focus, and the
# shell's file icons.
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# The COM objects behind files dragged out of Poros into Explorer: a data object, a drop source.
# `windows-core` is named for the `implement` macro, which refers to it by that name.
windows-core = { version = "0.62", optional = true }
windows = { version = "0.62", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Whether a compositing window manager runs, so the drag preview can be see-through, the icon
# theme's file icons, and files dragged out of Poros.
gtk = { version = "0.18", optional = true }
# Dolphin and the KDE desktop say over D-Bus where files dragged out of Poros were dropped.
zbus = { version = "5", optional = true }

[dev-dependencies]
tempfile = "3"
# Paused clocks, so tests of minute-long timeouts run instantly.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
