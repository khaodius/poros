name: Release

# Builds the Linux and Windows installers from one commit, publishes them with SHA-256
# checksums and signed build provenance, and writes the release notes from CHANGELOG.md.
# The installers are also signed with the update key (the TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets), and latest.json lists them for the in-app updater,
# which accepts only files signed by the key whose public half is in tauri.conf.json.
# A push to main that carries a version with no release yet publishes it and tags the commit
# it built; pushes whose version is already released do nothing. Pushing a tag named after the
# app version (v0.2.0 for 0.2.0), or running the workflow by hand, publishes that version too.
on:
  push:
    branches: [main]
    paths:
      - src-tauri/tauri.conf.json
      - .github/workflows/release.yml
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the version and tag
        id: version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag="v$version"
          npm_version=$(jq -r .version package.json)
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ "$npm_version" != "$version" ] || [ "$cargo_version" != "$version" ]; then
            echo "::error::Versions differ: tauri.conf.json $version, package.json $npm_version, Cargo.toml $cargo_version"
            exit 1
          fi
          release=true
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match the app version $version"
              exit 1
            fi
          elif git fetch --quiet --depth=1 origin "+refs/tags/$tag:refs/tags/$tag" 2> /dev/null; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "$tag is already released, nothing to publish"
              release=false
            elif [ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already exists on another commit; bump the version first"
              exit 1
            fi
          fi
          if [ "$release" = true ] &&
            ! awk -v v="$version" '$1 == "##" && $2 == v { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Check the update signing key
        if: steps.version.outputs.release == 'true'
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$(jq -r '.plugins.updater.pubkey // ""' src-tauri/tauri.conf.json)" ]; then
            echo "::error::plugins.updater.pubkey in src-tauri/tauri.conf.json is empty"
            exit 1
          fi
          if [ "$HAS_SIGNING_KEY" != true ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set"
            exit 1
          fi

  bundle:
    name: Bundle (${{ matrix.platform.name }})
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.platform.os }}
    strategy:
      matrix:
        platform:
          - name: Linux
            os: ubuntu-22.04
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/deb/*.deb.sig
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/rpm/*.rpm.sig
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
          - name: Windows
            os: windows-latest
            artifacts: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.sig
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
    # Release builds start from a clean toolchain and no build cache, so nothing from an
    # earlier run can end up in an installer.
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      # The Google and Microsoft apps cloud storage signs in with by default. Without them,
      # users add their own app registrations in Settings.
      - name: Build and sign the installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          POROS_GOOGLE_CLIENT_ID: ${{ secrets.POROS_GOOGLE_CLIENT_ID }}
          POROS_GOOGLE_CLIENT_SECRET: ${{ secrets.POROS_GOOGLE_CLIENT_SECRET }}
          POROS_MICROSOFT_CLIENT_ID: ${{ secrets.POROS_MICROSOFT_CLIENT_ID }}
        run: npm run tauri build -- --config src-tauri/tauri.release.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: ${{ matrix.platform.artifacts }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [version, bundle]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: bundles

      - name: Collect the installers
        run: |
          mkdir release signatures
          find bundles -type f -name '*.sig' -exec mv -n -t signatures {} +
          find bundles -type f -exec mv -n -t release {} +
          if [ "$(find bundles -type f | wc -l)" -ne 0 ]; then
            echo "::error::Two installers share a file name"
            exit 1
          fi
          for pattern in '*.deb' '*.rpm' '*.AppImage' '*.msi' '*-setup.exe'; do
            count=$(find release -name "$pattern" | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "::error::Expected one $pattern installer, found $count"
              exit 1
            fi
          done
          ls -l release

      # A signature from any other key than plugins.updater.pubkey would publish an update that
      # every installed copy rejects, and with requireSignedVersion each must name this version.
      - name: Check the update signatures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          jq -r .plugins.updater.pubkey src-tauri/tauri.conf.json | base64 -d > "$RUNNER_TEMP/update.pub"
          for file in release/*; do
            name=$(basename "$file")
            if [ ! -s "signatures/$name.sig" ]; then
              echo "::error::$name has no update signature"
              exit 1
            fi
            base64 -d "signatures/$name.sig" > "$RUNNER_TEMP/update.minisig"
            if ! minisign -V -q -p "$RUNNER_TEMP/update.pub" -m "$file" -x "$RUNNER_TEMP/update.minisig"; then
              echo "::error::The update signature of $name does not verify with the key in src-tauri/tauri.conf.json"
              exit 1
            fi
            if ! awk -F '\t' -v version="version:$VERSION" '/^trusted comment: / {
                for (i = 1; i <= NF; i++) if ($i == version) found = 1
              } END { exit !found }' "$RUNNER_TEMP/update.minisig"; then
              echo "::error::The update signature of $name does not name version $VERSION"
              exit 1
            fi
          done

      - name: Write checksums
        working-directory: release
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS.txt"
          mv "$RUNNER_TEMP/SHA256SUMS.txt" .
          cat SHA256SUMS.txt

      - name: Extract the changes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$1 == "##" { if (found) exit; found = ($2 == v); next } found' CHANGELOG.md > changes.md

      # The updater picks the entry for how the running copy was installed (windows-x86_64-nsis,
      # linux-x86_64-deb, ...), or the bare platform for copies it cannot place.
      - name: Write the update manifest
        run: |
          download_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          entry() {
            local file
            file=$(find release -name "$2" -printf '%f\n')
            if [ ! -s "signatures/$file.sig" ]; then
              echo "::error::$file has no update signature"
              exit 1
            fi
            jq -n --arg key "$1" --arg url "$download_url/$file" --rawfile signature "signatures/$file.sig" \
              '{($key): {url: $url, signature: ($signature | rtrimstr("\n"))}}' >> "$RUNNER_TEMP/platforms.json"
          }
          entry windows-x86_64-nsis '*-setup.exe'
          entry windows-x86_64-msi '*.msi'
          entry windows-x86_64 '*-setup.exe'
          entry linux-x86_64-appimage '*.AppImage'
          entry linux-x86_64-deb '*.deb'
          entry linux-x86_64-rpm '*.rpm'
          entry linux-x86_64 '*.AppImage'
          mkdir updater
          jq -s --arg version "$VERSION" --rawfile notes changes.md --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, notes: ($notes | gsub("^\\s+|\\s+$"; "")), pub_date: $date, platforms: add}' \
            "$RUNNER_TEMP/platforms.json" > updater/latest.json
          cat updater/latest.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/*
            updater/latest.json

      - name: Write release notes
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          tree_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$TAG"
          {
            cat changes.md
            echo
            echo "## Downloads"
            echo
            echo "| File | For | SHA-256 |"
            echo "| ---- | --- | ------- |"
            while read -r hash file; do
              case "$file" in
                *-setup.exe) kind="Windows setup (recommended for Windows)" ;;
                *.msi) kind="Windows Installer package" ;;
                *.deb) kind="Debian, Ubuntu, Linux Mint" ;;
                *.rpm) kind="Fedora, RHEL, openSUSE" ;;
                *.AppImage) kind="Any x86-64 Linux, no install needed" ;;
                *) kind="" ;;
              esac
              echo "| \`$file\` | $kind | \`$hash\` |"
            done < release/SHA256SUMS.txt
            echo
            echo "## Verifying a download"
            echo
            echo "\`SHA256SUMS.txt\` lists the SHA-256 checksum of every file above. If the checksum of"
            echo "your copy matches, it is byte for byte the file published here and was not changed or"
            echo "corrupted on the way to you."
            echo
            echo "On Linux, in the folder with your download and \`SHA256SUMS.txt\`:"
            echo
            echo '```sh'
            echo "sha256sum --check --ignore-missing SHA256SUMS.txt"
            echo '```'
            echo
            echo "On Windows, in PowerShell, then compare the result with the table (letter case does not matter):"
            echo
            echo '```powershell'
            echo "Get-FileHash .\\Poros_${VERSION}_x64-setup.exe -Algorithm SHA256"
            echo '```'
            echo
            echo "Every file also carries a signed build provenance attestation, recorded in a public"
            echo "transparency log, which proves it was built by this repository's release workflow from"
            echo "the \`$TAG\` tag and not uploaded by hand. With the [GitHub CLI](https://cli.github.com):"
            echo
            echo '```sh'
            echo "gh attestation verify Poros_${VERSION}_amd64.deb --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "Checksums and attestations prove where a file came from and that it is unaltered; they"
            echo "are not a virus scan. Everything in the installers is built from the source at"
            echo "[\`$TAG\`]($tree_url), in public, by [this workflow run]($run_url)."
            echo
            echo "The Windows installers are not code-signed yet, so SmartScreen may warn about an"
            echo "unknown publisher. Choose **More info** and then **Run anyway** once the checksum matches."
          } > notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then verify=(--verify-tag); fi
          gh release create "$TAG" release/* updater/latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Poros $VERSION" \
            --notes-file notes.md \
            "${verify[@]}"
